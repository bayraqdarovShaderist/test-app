<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Test App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #6b73ff 0%, #000dff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card { text-align: center; color: white; }
  h1 { font-size: 1.6rem; margin-bottom: 1.5rem; font-weight: 600; }
  #count { font-size: 5rem; font-weight: 700; margin-bottom: 2rem; }
  button {
    font-size: 1.1rem;
    padding: 16px 40px;
    border: none;
    border-radius: 50px;
    background: white;
    color: #000dff;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.96); }
  .reset {
    display: block;
    margin: 20px auto 0;
    background: transparent;
    color: white;
    border: 1px solid rgba(255,255,255,0.5);
    font-size: 0.9rem;
    padding: 8px 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎉 It works!</h1>
    <div id="count">0</div>
    <button onclick="increment()">Tap me</button>
    <button class="reset" onclick="reset()">Reset</button>
  </div>

<script>
  let count = parseInt(localStorage.getItem('testCount')) || 0;
  document.getElementById('count').textContent = count;

  function increment() {
    count++;
    localStorage.setItem('testCount', count);
    document.getElementById('count').textContent = count;
  }

  function reset() {
    count = 0;
    localStorage.setItem('testCount', count);
    document.getElementById('count').textContent = count;
  }
</script>
</body>
</html>
